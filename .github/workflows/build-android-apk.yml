# ---------------------------------------------------------------------------
# Builds the SuperCalculator Android APK (arm64-v8a + armeabi-v7a).
# Uses the pre-installed Android SDK on the GitHub runner; only installs
# the NDK version required by the project.
#
# Triggers
#   * workflow_dispatch  — manual run from the Actions tab; the release checkbox
#                          controls whether a GitHub Release is published.
#   * push on tag v*     — builds an APK artifact only; it does not publish
#                          a release.
#
# WARNING: Each run consumes ~6-8 GitHub Actions minutes on free tier.
# Run sparingly. Artifacts expire after 30 days; Releases are permanent.
# ---------------------------------------------------------------------------
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      push-release:
        description: 'Create a GitHub Release after the build succeeds?'
        type: boolean
        default: false
      release-tag:
        description: 'Optional release tag; defaults to android-v<version>-run<run number>'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK 27
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            --install "ndk;27.0.12077973" > /dev/null 2>&1
          echo "NDK installed at $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -3

      # CMakeLists.txt references the root calc_core.c via relative path,
      # so no copy step is needed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with debug key
        run: |
          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIGNED="SuperCalculator-android-aarch64.apk"
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug,O=SuperCalc,C=US" > /dev/null 2>&1
          # Dynamically find build-tools version
          BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
            --ks debug.keystore --ks-pass pass:android \
            --out $APK_SIGNED $APK_UNSIGNED
          ls -lh $APK_SIGNED
          file $APK_SIGNED

      - name: Read APK version
        run: |
          echo "APK_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)" >> $GITHUB_ENV
          echo "APK_VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android/app/build.gradle.kts)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SuperCalculator-android-aarch64
          path: SuperCalculator-android-aarch64.apk
          retention-days: 30

      # -----------------------------------------------------------------------
      # GitHub Release
      # Only a manual run with push-release=true publishes a release. The tag
      # is optional and is generated from the version and run number if omitted.
      # Uses the built-in gh CLI so no extra action is required.
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push-release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          TAG="${RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            TAG="android-v${APK_VERSION}-run${GITHUB_RUN_NUMBER}"
          fi

          APK="SuperCalculator-android-aarch64.apk"
          cp "$APK" "SuperCalculator-android-${TAG}.apk"

          # Re-running on an existing tag should update, not fail.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" \
            "SuperCalculator-android-${TAG}.apk" \
            --title "Super Calculator Android ${TAG}" \
            --prerelease \
            --notes "## Super Function Graphing Calculator — Android ${TAG}

          Debug-key signed test APK for **arm64-v8a** and **armeabi-v7a** devices; this is not a production store release.

          | Item | Value |
          |------|-------|
          | Package | \`com.supercalc\` |
          | Version | ${APK_VERSION:-unknown} (code ${APK_VERSION_CODE:-unknown}) |
          | Min SDK | 26 (Android 8.0) |
          | Target SDK | 34 (Android 14) |
          | ABIs | arm64-v8a, armeabi-v7a |

          > **Release publication:** once the build succeeds, the “Create a GitHub Release” checkbox alone controls publication.
          > Automated APK signature validation is intentionally not run.
          >
          > **Signing:** this debug-key-signed test APK is for sideloading, not production or Google Play.
          > A new key is generated on every run, so uninstall the previous build before reinstalling.

          ### Highlights
          - 2D plots now break at true discontinuities (tan, 1/x, poles) instead of
            drawing phantom connecting lines.
          - 3D surfaces tear along poles and asymptotes instead of spiking across.
          - ~4x denser sampling plus pole-adjacent refinement for sharper tan branches.

          *Built by GitHub Actions.*"
