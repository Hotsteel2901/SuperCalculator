name: Flutter Next Era checks

on:
  pull_request:
    paths:
      - 'flutter/**'
      - 'native/calc_core/**'
      - 'calc_core.c'
      - 'tool/**'
      - '.github/workflows/flutter-next-era.yml'
  push:
    branches: [master]
    paths:
      - 'flutter/**'
      - 'native/calc_core/**'
      - 'calc_core.c'
      - 'tool/**'
      - '.github/workflows/flutter-next-era.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter --version
      - run: dart --version
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Apply Dart formatting
        run: dart format lib test integration_test
      - name: Commit formatting changes
        if: github.event_name == 'pull_request'
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- flutter; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter/lib flutter/test flutter/integration_test
          git commit -m 'style: format Flutter sources'
          git push origin "HEAD:${{ github.head_ref }}"
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C ABI smoke test
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -O2 -fPIC \
            -DSUPERCALC_CORE_BUILD -shared -I native/calc_core/include \
            calc_core.c native/calc_core/src/supercalc_core.c -lm \
            -o /tmp/libsupercalc_core.so
          gcc -std=c11 -Wall -Wextra -Wpedantic -O2 -I native/calc_core/include \
            native/calc_core/tests/smoke_test.c -L/tmp -Wl,-rpath,/tmp \
            -lsupercalc_core -o /tmp/supercalc_core_smoke
          /tmp/supercalc_core_smoke
