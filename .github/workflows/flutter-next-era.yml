name: Flutter Next Era checks

on:
  pull_request:
    paths:
      - 'flutter/**'
      - 'native/calc_core/**'
      - 'calc_core.c'
      - 'tool/**'
      - '.github/workflows/flutter-next-era.yml'
  push:
    branches: [master]
    paths:
      - 'flutter/**'
      - 'native/calc_core/**'
      - 'calc_core.c'
      - 'tool/**'
      - '.github/workflows/flutter-next-era.yml'
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter --version
      - run: dart --version
      - name: Resolve Dart and Flutter dependencies
        id: pub_get
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pub-get.log"
      - name: Report dependency resolution failure
        if: steps.pub_get.outcome == 'failure'
        run: |
          echo '### flutter pub get diagnostics' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 "$RUNNER_TEMP/pub-get.log" >> "$GITHUB_STEP_SUMMARY"
          message="$(tail -n 12 "$RUNNER_TEMP/pub-get.log" | tr '\\n' ' ' | cut -c1-3500)"
          echo "::error title=flutter pub get failed::$message"
          exit 1
      - run: flutter gen-l10n
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C ABI smoke test
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -O2 -fPIC \
            -DSUPERCALC_CORE_BUILD -shared -I native/calc_core/include \
            calc_core.c native/calc_core/src/supercalc_core.c -lm \
            -o /tmp/libsupercalc_core.so
          gcc -std=c11 -Wall -Wextra -Wpedantic -O2 -I native/calc_core/include \
            native/calc_core/tests/smoke_test.c -L/tmp -Wl,-rpath,/tmp \
            -lsupercalc_core -o /tmp/supercalc_core_smoke
          /tmp/supercalc_core_smoke
