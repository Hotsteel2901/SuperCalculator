name: Flutter Next Era platform installers

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: Publish a GitHub Release after all platform artifacts pass
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  APP_VERSION: '6.0.0'
  PROJECT_NAME: supercalculator_next_era
  PROJECT_ORG: com.supercalc

jobs:
  web:
    name: Web release package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release
      - name: Archive Web application
        run: tar -czf "../SuperCalculator-Next-Era-v${APP_VERSION}-web.tar.gz" -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-web
          path: SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-web.tar.gz
          if-no-files-found: error

  android:
    name: Android APK release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create --no-pub --platforms=android --org "$PROJECT_ORG" --project-name "$PROJECT_NAME" .
      - name: Apply SuperCalculator Android icon
        shell: bash
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "../android/app/src/main/res/mipmap-$density/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26
          cp ../android/app/src/main/res/drawable/ic_launcher_background.xml android/app/src/main/res/drawable/
          cp ../android/app/src/main/res/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/
          cp ../android/app/src/main/res/drawable/ic_launcher_monochrome.xml android/app/src/main/res/drawable/
          cp ../android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build Android arm64 native ABI library
        shell: bash
        run: |
          set -euo pipefail
          clang_path="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk" -type f -name 'aarch64-linux-android*-clang' -print -quit)"
          test -n "$clang_path"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          "$clang_path" -std=c11 -shared -O2 -fPIC -DSUPERCALC_CORE_BUILD \
            -I ../native/calc_core/include ../calc_core.c \
            ../native/calc_core/src/supercalc_core.c -lm \
            -o android/app/src/main/jniLibs/arm64-v8a/libsupercalc_core.so
      - run: flutter build apk --release --split-per-abi
      - name: Build Android universal release APK
        run: flutter build apk --release
      - name: Build Android release app bundle
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-android
          path: |
            flutter/build/app/outputs/flutter-apk/*.apk
            flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create --no-pub --platforms=linux --org "$PROJECT_ORG" --project-name "$PROJECT_NAME" .
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - name: Add native C ABI to Linux bundle
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bundle="flutter/build/linux/x64/release/bundle"
          gcc -std=c11 -shared -O2 -fPIC -DSUPERCALC_CORE_BUILD \
            -I native/calc_core/include calc_core.c \
            native/calc_core/src/supercalc_core.c -lm \
            -o "$bundle/libsupercalc_core.so"
      - name: Create Linux tarball and deb package
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bundle="flutter/build/linux/x64/release/bundle"
          tarball="SuperCalculator-Next-Era-v${APP_VERSION}-linux-x64.tar.gz"
          deb="SuperCalculator-Next-Era-v${APP_VERSION}-linux-x64.deb"
          cp flutter/assets/branding/supercalculator-icon-512.png "$bundle/supercalculator-next-era.png"
          tar -czf "$tarball" -C "$bundle" .
          pkg="/tmp/supercalculator-next-era"
          rm -rf "$pkg"
          mkdir -p "$pkg/DEBIAN" "$pkg/opt/supercalculator-next-era" \
            "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/512x512/apps" "$pkg/usr/bin"
          cp -a "$bundle"/. "$pkg/opt/supercalculator-next-era/"
          cp flutter/assets/branding/supercalculator-icon-512.png \
            "$pkg/usr/share/icons/hicolor/512x512/apps/supercalculator-next-era.png"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: supercalculator-next-era
          Version: ${APP_VERSION}
          Section: math
          Priority: optional
          Architecture: amd64
          Maintainer: SuperCalculator maintainers
          Description: SuperCalculator - Next Era scientific calculator
          EOF
          cat > "$pkg/usr/share/applications/supercalculator-next-era.desktop" <<'EOF'
          [Desktop Entry]
          Name=SuperCalculator - Next Era
          Comment=Scientific calculator and plotting workbench
          Exec=/opt/supercalculator-next-era/supercalculator_next_era
          Icon=supercalculator-next-era
          Terminal=false
          Type=Application
          Categories=Science;Education;Utility;
          EOF
          cat > "$pkg/usr/bin/supercalculator-next-era" <<'EOF'
          #!/bin/sh
          exec /opt/supercalculator-next-era/supercalculator_next_era "$@"
          EOF
          chmod +x "$pkg/usr/bin/supercalculator-next-era"
          dpkg-deb --build "$pkg" "$deb"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-linux
          path: |
            SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-linux-x64.tar.gz
            SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-linux-x64.deb
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create --no-pub --platforms=windows --org "$env:PROJECT_ORG" --project-name "$env:PROJECT_NAME" .
      - name: Apply SuperCalculator Windows icon
        shell: pwsh
        run: Copy-Item ../SuperCalculator.ico windows/runner/resources/app_icon.ico -Force
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - name: Add native C ABI and create portable ZIP
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $bundle = "flutter/build/windows/x64/runner/Release"
          gcc -std=c11 -shared -O2 -DSUPERCALC_CORE_BUILD -Inative/calc_core/include calc_core.c native/calc_core/src/supercalc_core.c -lm -o "$bundle/supercalc_core.dll"
          Compress-Archive -Path "$bundle/*" -DestinationPath "SuperCalculator-Next-Era-v$env:APP_VERSION-windows-x64.zip" -Force
      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          choco install innosetup --no-progress --yes
          $bundle = (Resolve-Path "flutter/build/windows/x64/runner/Release").Path
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DBuildDir=$bundle" "packaging/windows/SuperCalculator.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-windows
          path: |
            SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-windows-x64.zip
            packaging/windows/Output/SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS application
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create --no-pub --platforms=macos --org "$PROJECT_ORG" --project-name "$PROJECT_NAME" .
      - name: Apply SuperCalculator macOS icon
        run: cp -R "$GITHUB_WORKSPACE/flutter/assets/branding/macos/AppIcon.appiconset/." macos/Runner/Assets.xcassets/AppIcon.appiconset/
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build macos --release
      - name: Add native C ABI and create DMG
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          app="$(find flutter/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          mkdir -p "$app/Contents/Frameworks"
          clang -std=c11 -shared -O2 -fPIC -DSUPERCALC_CORE_BUILD \
            -I native/calc_core/include calc_core.c \
            native/calc_core/src/supercalc_core.c -lm \
            -o "$app/Contents/Frameworks/libsupercalc_core.dylib"
          # The hosted runner builds one native architecture. Do not label this
          # artifact universal unless a separate multi-arch build is performed.
          ditto -c -k --sequesterRsrc --keepParent "$app" "SuperCalculator-Next-Era-v${APP_VERSION}-macos-host-arch.zip"
          hdiutil create -volname 'SuperCalculator - Next Era' -srcfolder "$app" \
            -ov -format UDZO "SuperCalculator-Next-Era-v${APP_VERSION}-macos-host-arch.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-macos
          path: |
            SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-macos-host-arch.zip
            SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-macos-host-arch.dmg
          if-no-files-found: error

  ios:
    name: iOS unsigned app package
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create --no-pub --platforms=ios --org "$PROJECT_ORG" --project-name "$PROJECT_NAME" .
      - name: Apply SuperCalculator iOS icon
        run: cp -R "$GITHUB_WORKSPACE/flutter/assets/branding/ios/AppIcon.appiconset/." ios/Runner/Assets.xcassets/AppIcon.appiconset/
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p ios-payload/Payload
          app="$(find flutter/build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          cp -R "$app" ios-payload/Payload/
          (cd ios-payload && zip -qry "../SuperCalculator-Next-Era-v${APP_VERSION}-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-ios
          path: SuperCalculator-Next-Era-v${{ env.APP_VERSION }}-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish optional GitHub Release
    if: inputs.publish-release == true && startsWith(github.ref, 'refs/tags/next-era-v')
    needs: [web, android, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find . -type f ! -name SHA256SUMS -print0 | sort -z
          )
          test "${#assets[@]}" -gt 0
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          notes="$(cat <<'EOF'
          ## SuperCalculator - Next Era v6.0.0

          A cross-platform scientific calculator and plotting workbench built around the new Flutter shell, replaceable computation backends, and the versioned native C ABI.

          ### Included in this release
          - Flutter Web, Android APK/AAB, Linux packages, Windows installer, macOS host-architecture app, and an unsigned iOS IPA payload.
          - Expression evaluation, calculus, equations, ODE methods, plotting, statistics, data analysis, matrices, probability, finance, and history/preset workflows.
          - Native arm64 calculation support where the platform artifact provides it, with a Dart fallback where native packaging is not supplied.
          - SHA256SUMS covering every published artifact.

          ### Release notes
          - The 3D surface view is an interactive lightweight projection preview, not a full GPU mesh renderer.
          - Apple signing/notarization and repository keystore signing are intentionally explicit release gates; unsigned artifacts are labeled accordingly.
          - macOS artifacts are for the hosted runner architecture and are not presented as universal binaries.
          - The GitHub Pages deployment is maintained separately from this installer bundle.

          Use the checksum file before installation and consult the compatibility report for platform-specific signing and installation notes.
          EOF
          )"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "SuperCalculator - Next Era $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$notes"
